<div class="progress mb-1" style="height: 8px;">
    <div id="barraPassword" class="progress-bar" role="progressbar"
         style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
</div>
<div id="textoPassword" class="form-text mb-2"></div>

<script>
(function () {
    const input = document.getElementById('{{ campo_id }}');
    const barra = document.getElementById('barraPassword');
    const texto = document.getElementById('textoPassword');

    if (!input || !barra || !texto) {
        return;
    }

    function nivelPassword(password) {
        if (!password) {
            return { puntos: 0, nivel: 0 };
        }

        let puntos = 0;
        if (password.length >= 8) puntos += 1;
        if (/[a-z]/.test(password)) puntos += 1;
        if (/[A-Z]/.test(password)) puntos += 1;
        if (/\d/.test(password)) puntos += 1;
        if (/[^A-Za-z0-9]/.test(password)) puntos += 1;

        let nivel = 1;
        if (puntos === 5) {
            nivel = 3;
        } else if (puntos === 4) {
            nivel = 2;
        }
        return { puntos: puntos, nivel: nivel };
    }

    function actualizarBarra() {
        const { nivel } = nivelPassword(input.value);
        const estados = {
            0: { ancho: '0%', clase: '', texto: '' },
            1: { ancho: '33%', clase: 'bg-danger', texto: 'Contraseña débil' },
            2: { ancho: '66%', clase: 'bg-warning', texto: 'Contraseña media' },
            3: { ancho: '100%', clase: 'bg-success', texto: 'Contraseña segura' },
        };
        const estado = estados[nivel];

        barra.className = 'progress-bar ' + estado.clase;
        barra.style.width = estado.ancho;
        barra.setAttribute('aria-valuenow', parseInt(estado.ancho, 10));
        texto.textContent = estado.texto;
        texto.className = 'form-text mb-2 ' +
            (nivel === 1 ? 'text-danger' : nivel === 2 ? 'text-warning-emphasis' : nivel === 3 ? 'text-success' : '');
    }

    input.addEventListener('input', actualizarBarra);
    actualizarBarra();
})();
</script>
